<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel RFID — Controle de Acesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">

    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">Controle de Acesso</h1>
        <p class="text-sm text-slate-400">Sala: <span class="font-mono text-white font-semibold">E04</span></p>
      </div>
      <div id="statusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 text-xs text-slate-400 w-fit">
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
        <span>Conectando...</span>
      </div>
    </header>

    <section class="grid grid-cols-1 sm:grid-cols-4 gap-4">
      <button id="btnOpen" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition p-4 rounded-xl font-medium shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
        <span class="text-2xl"></span>
        <span>Abrir Porta</span>
      </button>

      <button id="btnToggleAcc" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition p-4 rounded-xl font-medium shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
        <span class="text-2xl"></span>
        <span id="txtToggleAcc">Modo Normalmente Aberto</span>
      </button>

      <button id="btnSync" class="bg-slate-700 hover:bg-slate-600 active:scale-95 transition p-4 rounded-xl font-medium shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
        <span class="text-2xl"></span>
        <span>Sincronizar Cache</span>
      </button>

      <button id="btnClearLogs" class="bg-rose-700 hover:bg-rose-600 active:scale-95 transition p-4 rounded-xl font-medium shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
        <span class="text-2xl"></span>
        <span>Limpar Histórico</span>
      </button>
    </section>

    <section class="bg-slate-800/80 rounded-xl p-4 shadow-xl border border-slate-700">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div>
          <h2 class="text-lg font-semibold text-slate-200">Histórico de Acessos em Tempo Real</h2>
          <span class="text-xs text-slate-400 font-mono">Últimos 10 registros</span>
        </div>
        <button id="btnExportCSV" class="bg-slate-700 hover:bg-slate-600 active:scale-95 transition px-3 py-1.5 rounded-lg text-xs font-medium text-slate-200 border border-slate-600 flex items-center justify-center gap-1.5 w-fit cursor-pointer">
          <span>Exportar para Planilha (.csv)</span>
        </button>
      </div>

      <div class="overflow-x-auto">
        <table id="accessTable" class="w-full text-sm border-collapse border border-slate-700">
          <thead>
            <tr class="bg-slate-700/50 text-slate-300 border border-slate-700">
              <th class="py-2.5 px-3 text-center border border-slate-700 font-medium">Data / Hora</th>
              <th class="py-2.5 px-3 text-center border border-slate-700 font-medium">Cartão UID</th>
              <th class="py-2.5 px-3 text-center border border-slate-700 font-medium">Identificação</th>
              <th class="py-2.5 px-3 text-center border border-slate-700 font-medium">Acesso</th>
            </tr>
          </thead>
          <tbody id="logsTableBody" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="4" class="text-center py-6 text-slate-500 border border-slate-700">Aguardando leituras ou registros...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://rfid-controle-acesso-ifpe-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const DOOR_ID = "E04";

    const statusBadge = document.getElementById("statusBadge");
    const txtToggleAcc = document.getElementById("txtToggleAcc");
    const logsTableBody = document.getElementById("logsTableBody");
    const btnExportCSV = document.getElementById("btnExportCSV");

    let currentAccMode = false;
    let lastSeenTimestamp = 0;
    let isDeviceOnlineFlag = false;
    let currentLogsList = [];

    // Função de formatação para padrão brasileiro (DD/MM/AAAA HH:MM:SS)
    function formatToBRDate(dateStr) {
      if (!dateStr || dateStr.includes("Aguardando")) return dateStr || '-';
      const parts = dateStr.trim().split(" ");
      if (parts.length === 2 && parts[0].includes("-")) {
        const dateParts = parts[0].split("-");
        if (dateParts.length === 3) {
          return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]} ${parts[1]}`;
        }
      }
      return dateStr;
    }

    function renderStatus() {
      const now = Math.floor(Date.now() / 1000);
      const isOnline = isDeviceOnlineFlag && (now - lastSeenTimestamp <= 30);

      if (isOnline) {
        statusBadge.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-emerald-400 font-medium">ESP32 Online ${currentAccMode ? '• Modo Normalmente Aberto' : ''}</span>
        `;
      } else {
        statusBadge.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
          <span class="text-rose-400 font-medium">ESP32 Offline</span>
        `;
      }
    }

    setInterval(renderStatus, 1000);

    onValue(ref(db, `doors/${DOOR_ID}/status`), (snap) => {
      const val = snap.val();
      if (!val) return;

      currentAccMode = !!val.accessibleMode;
      txtToggleAcc.textContent = currentAccMode ? "Desativar Modo Normalmente Aberto" : "Ativar Modo Normalmente Aberto";
      lastSeenTimestamp = val.lastSeen || 0;
      isDeviceOnlineFlag = !!val.online;
      renderStatus();
    });

    onValue(ref(db, `logs/${DOOR_ID}`), (snap) => {
      const data = snap.val();
      if (!data) {
        currentLogsList = [];
        logsTableBody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-6 text-slate-500 border border-slate-700">Aguardando leituras ou registros...</td>
          </tr>
        `;
        return;
      }

      currentLogsList = Object.values(data).sort((a, b) => (b.unixTs || 0) - (a.unixTs || 0)).slice(0, 10);
      
      logsTableBody.innerHTML = currentLogsList.map(item => `
        <tr class="hover:bg-slate-700/30">
          <td class="py-2 px-3 text-center text-slate-400 font-mono text-xs border border-slate-700">${formatToBRDate(item.datetime)}</td>
          <td class="py-2 px-3 text-center font-mono border border-slate-700">${item.cardID || '-'}</td>
          <td class="py-2 px-3 text-center font-medium ${item.authorized ? 'text-white' : 'text-rose-300'} border border-slate-700">${item.userName || 'Desconhecido'}</td>
          <td class="py-2 px-3 text-center border border-slate-700">
            <span class="px-2 py-0.5 rounded text-xs ${item.authorized ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
              ${item.authorized ? 'Concedido' : 'Negado'}
            </span>
          </td>
        </tr>
      `).join('');
    });

    document.getElementById("btnOpen").addEventListener("click", () => {
      update(ref(db, `doors/${DOOR_ID}/commands`), { openDoor: true });
    });

    document.getElementById("btnToggleAcc").addEventListener("click", () => {
      update(ref(db, `doors/${DOOR_ID}/commands`), { setAccessibleMode: currentAccMode ? "off" : "on" });
    });

    document.getElementById("btnSync").addEventListener("click", () => {
      update(ref(db, `doors/${DOOR_ID}/commands`), { forceSync: true });
    });

    document.getElementById("btnClearLogs").addEventListener("click", () => {
      if (confirm("Tem certeza que deseja apagar o histórico de acessos desta porta?")) {
        remove(ref(db, `logs/${DOOR_ID}`));
      }
    });

    // Rotina de exportação para planilha CSV compatível com Excel/Google Sheets
    btnExportCSV.addEventListener("click", () => {
      if (!currentLogsList || currentLogsList.length === 0) {
        alert("Não há registros para exportar.");
        return;
      }

      let csvContent = "\uFEFFData / Hora;Cartão UID;Identificação;Acesso\n";
      currentLogsList.forEach(row => {
        const dt = formatToBRDate(row.datetime);
        const card = row.cardID || '-';
        const user = (row.userName || 'Desconhecido').replace(/;/g, ' ');
        const access = row.authorized ? 'Concedido' : 'Negado';
        csvContent += `"${dt}";"${card}";"${user}";"${access}"\n`;
      });

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `relatorio_acessos_E04.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
